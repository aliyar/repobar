<div class="macbar" data-strip>
  <div class="macbar-in">
    <nav class="macbar-menus" aria-label="Sections">
      <span class="macbar-app"><svg class="mb-glyph" viewBox="0 0 14 14" aria-hidden="true"><use href="#glyph-branch"/></svg></span>
      <a href="/">RepoBar</a>
      <a href="/#glance">The dots</a>
      <a href="/#panel">The panel</a>
      <a href="/#reads">What it runs</a>
      <a href="/#install" class="macbar-cta">Download</a>
      <a href="https://github.com/aliyar/repobar" target="_blank" rel="noopener">GitHub</a>
    </nav>
    <div class="macbar-status">
      <a class="mb-item" href="/" aria-label="RepoBar: 2 of 5 repositories have new commits. Open the working demo on the home page.">
        <svg class="mb-glyph" viewBox="0 0 14 14" aria-hidden="true"><use href="#glyph-branch"/></svg>
        <span class="mb-dots" aria-hidden="true">
          <i class="mb-dot mb-dot--r1 is-new"></i>
          <i class="mb-dot mb-dot--r2 is-new"></i>
          <i class="mb-dot mb-dot--r3"></i>
          <i class="mb-dot mb-dot--r4 is-error"><b>!</b></i>
          <i class="mb-dot mb-dot--r5"></i>
        </span>
      </a>
      <button type="button" class="mb-item mb-item--appearance" data-action="appearance"
              title="Switch the menu bar between dark and light"
              aria-label="Show the menu bar in the light appearance">
        <svg class="mb-sun" viewBox="0 0 24 24" aria-hidden="true"><use href="#glyph-sun"/></svg>
        <svg class="mb-moon" viewBox="0 0 24 24" aria-hidden="true"><use href="#glyph-moon"/></svg>
      </button>
      <svg class="mb-sys" viewBox="0 0 24 24" aria-hidden="true"><use href="#glyph-wifi"/></svg>
      <svg class="mb-sys mb-sys--bat" viewBox="0 0 24 24" aria-hidden="true"><use href="#glyph-battery"/></svg>
      <span class="mb-clock" data-clock>Mon 9:41</span>
    </div>
  </div>
</div>
