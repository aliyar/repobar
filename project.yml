name: RepoBar
options:
  bundleIdPrefix: com.aliyar
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.45.0"
  defaultSourceDirectoryType: syncedFolder

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: RCQFGHVGQJ
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CURRENT_PROJECT_VERSION: "8"
    MARKETING_VERSION: "0.3.1"
  configs:
    release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  RepoBarKit:
    path: Packages/RepoBarKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.9.6"

targets:
  RepoBar:
    type: application
    platform: macOS
    sources:
      - path: RepoBar
      - path: Supporting
        type: group
        buildPhase: none
        optional: true
    dependencies:
      - package: RepoBarKit
        product: GitEngine
      - package: Sparkle
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: RepoBar
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 Aliyar. All rights reserved."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        ITSAppUsesNonExemptEncryption: false
        NSDesktopFolderUsageDescription: "RepoBar reads git repositories you add from your Desktop."
        NSDocumentsFolderUsageDescription: "RepoBar reads git repositories you add from your Documents."
        NSDownloadsFolderUsageDescription: "RepoBar reads git repositories you add from your Downloads."
        NSRemovableVolumesUsageDescription: "RepoBar reads git repositories you add on external drives."
        NSNetworkVolumesUsageDescription: "RepoBar reads git repositories you add on network volumes."
        # Sparkle auto-update: feed is attached to every GitHub release as an asset.
        SUFeedURL: "https://github.com/aliyar/repobar/releases/latest/download/appcast.xml"
        SUPublicEDKey: "p+uMYPdgR+8fYhuFBDXI5szEujxRNNDCcYhrQgphrW0="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: Supporting/RepoBar.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliyar.RepoBar
        PRODUCT_NAME: RepoBar
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - RepoBarTests
        - package: RepoBarKit/GitEngineTests
      gatherCoverageData: true

  RepoBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RepoBarTests
    dependencies:
      - target: RepoBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aliyar.RepoBarTests
        GENERATE_INFOPLIST_FILE: YES
